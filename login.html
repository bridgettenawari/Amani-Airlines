<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Amani Airlines</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PASTE YOUR HEADER HERE -->
    <header> 
        <div class="logo">
            <h1>✈️ Amani Airlines</h1>
        </div>
        
        <!-- Navigation menu -->
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Arrivals</a></li>
                <li><a href="#">Departures</a></li>
                <li><a href="#">Hotels</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>
        
        <!-- Search bar inside the header -->
        <div class="nav-search">
            <input type="search" placeholder="🔍 Search">
        </div>

        <div class="nav-actions">
    <a href="login.html" class="login-link">Login</a>
    <a href="register.html" class="btn-register">Create Account</a>
    
      </div>
</header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to manage your bookings.</p>
            
            <form>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-gold full-width">Login</button>
            </form>
            
            <p class="switch-text">Don't have an account? <a href="register.html">Create one here</a></p>
        </div>
    </main>

    <!-- PASTE YOUR FOOTER HERE -->
    <footer> <div class="footer-left">
            <h3>✈️ Amani Airlines</h3>
        </div>
        <div class="footer-center">
            <p>&copy; 2026 Amani Airlines. All rights reserved.</p>
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
        </div>
     </footer>

</body>
</html>
