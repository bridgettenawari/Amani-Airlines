<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Amani Airlines</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header> 
        <div class="logo">
            <a href="../index.html">
                <img src="../assets/images/logo.png" alt="Amani Airlines Logo" class="logo-img">
                <h1>Amani Airlines</h1>
            </a>
        </div>
        
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../flights/arrivals.html">Arrivals</a></li>
                <li><a href="../flights/departures.html">Departures</a></li>
                <li><a href="../hotels.html">Hotels</a></li>
                <li><a href="../about.html">About</a></li>
            </ul>
        </nav>
        
        <div class="nav-search">
            <input type="search" placeholder="🔍 Search">
        </div>

        <div class="nav-actions">
            <a href="login.html" class="login-link">Login</a>
            <a href="register.html" class="btn-register">Create Account</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join Amani Airlines to start booking.</p>
            
            <form id="registerForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Re-enter password" required>
                </div>
                
                <button type="submit" class="btn-gold full-width">Sign Up</button>
            </form>
            
            <p class="switch-text">Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </main>

    <footer> 
        <div class="footer-left">
            <h3>✈️ Amani Airlines</h3>
        </div>
        <div class="footer-center">
            <p>&copy; 2026 Amani Airlines. All rights reserved.</p>
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
        </div>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            // Send the data to the Python Backend
            fetch('http://127.0.0.1:5000/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("Success! " + data.message);
                    
                    // 1. Save login state AND the user's email
                    localStorage.setItem('isLoggedIn', 'true'); 
                    localStorage.setItem('userEmail', email); // <--- NEW LINE
                    
                    // 2. Send to Account Dashboard
                    window.location.href = "../account.html";
                } else {
                    alert("Error: " + data.message);
                }
            })
            .catch(error => {
                // Offline Fallback
                console.log("Python backend not detected. Using localStorage fallback.");
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', email); // <--- NEW LINE
                alert("Account Created (Offline Mode)!");
                window.location.href = "../account.html";
            });
        });
    </script>

</body>
</html>
