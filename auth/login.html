<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Amani Airlines</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- 1. FIXED CSS LINK: Go up one folder, then into css -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header> 
        <div class="logo">
            <h1>✈️ Amani Airlines</h1>
        </div>
        
        <nav>
            <ul>
                <!-- 2. FIXED HOME LINK: Go up one folder to find index.html -->
                <li><a href="../index.html">Home</a></li>
                <li><a href="../flights/arrivals.html">Arrivals</a></li>
                <li><a href="../flights/departures.html">Departures</a></li>
                <li><a href="../hotels.html">Hotels</a></li>
                <li><a href="../about.html">About</a></li>
            </ul>
        </nav>
        
        <div class="nav-search">
            <input type="search" placeholder="🔍 Search">
        </div>

        <div class="nav-actions">
            <!-- 3. FIXED AUTH LINKS: We are already in the auth folder, so no ../ needed here -->
            <a href="login.html" class="login-link">Login</a>
            <a href="register.html" class="btn-register">Create Account</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to manage your bookings.</p>
            
            <form>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-gold full-width">Login</button>
            </form>
            
            <p class="switch-text">Don't have an account? <a href="register.html">Create one here</a></p>
        </div>
    </main>

    <footer> 
        <div class="footer-left">
            <h3>✈️ Amani Airlines</h3>
        </div>
        <div class="footer-center">
            <p>&copy; 2026 Amani Airlines. All rights reserved.</p>
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
        </div>
    </footer>
    <script>
    // Find the login form (you might need to add id="loginForm" to your <form> tag)
    const loginForm = document.querySelector('form');
    
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Stop the page from reloading
        
        // This is a fake login for now. 
        // Later, your Python backend will check the real password here.
        localStorage.setItem('isLoggedIn', 'true');
        
        alert("Login Successful! Welcome back to Amani Airlines.");
        window.location.href = "../index.html"; // Go back home
    });
</script>

</body>
</html>
