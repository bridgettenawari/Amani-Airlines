<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Amani Airlines</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header> 
        <div class="logo">
            <a href="../index.html">
                <img src="../assets/images/logo.png" alt="Amani Airlines Logo" class="logo-img">
                <h1>Amani Airlines</h1>
            </a>
        </div>
        
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../flights/arrivals.html">Arrivals</a></li>
                <li><a href="../flights/departures.html">Departures</a></li>
                <li><a href="../hotels.html">Hotels</a></li>
                <li><a href="../about.html">About</a></li>
            </ul>
        </nav>
        
        <div class="nav-search">
            <input type="search" placeholder="🔍 Search">
        </div>

        <div class="nav-actions">
            <a href="login.html" class="login-link">Login</a>
            <a href="register.html" class="btn-register">Create Account</a>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to manage your bookings.</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-gold full-width">Login</button>
            </form>
            
            <p class="switch-text">Don't have an account? <a href="register.html">Create one here</a></p>
        </div>
    </main>

    <footer> 
        <div class="footer-left">
            <h3>✈️ Amani Airlines</h3>
        </div>
        <div class="footer-center">
            <p>&copy; 2026 Amani Airlines. All rights reserved.</p>
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms</a>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stops the page from reloading!
            
            // 1. Mark the user as logged in
            localStorage.setItem('isLoggedIn', 'true');
            
            // 2. Show a success message
            alert("Login Successful! Welcome back to Amani Airlines.");
            
            // 3. Send them to the Account Dashboard (where they have all options)
            window.location.href = "../account.html"; 
        });
    </script>

</body>
</html>
